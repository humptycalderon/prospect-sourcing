name: Weekly Prospect Sourcing & Market Digest

on:
  schedule:
    - cron: '0 10 * * 1'   # 6:00 AM EDT (UTC-4) every Monday
  workflow_dispatch:         # allows manual trigger from GitHub UI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  # ── Job 1: Prospect Sourcing (6:00 AM EDT) ──────────────────────────────
  prospect-sourcing:
    name: Prospect Sourcing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run prospect sourcing
        run: python main.py
        env:
          GITHUB_TOKEN:        ${{ secrets.GH_TOKEN }}
          ANTHROPIC_API_KEY:   ${{ secrets.ANTHROPIC_API_KEY }}
          NOTION_TOKEN:        ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID:  ${{ secrets.NOTION_DATABASE_ID }}
          TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
          PRODUCTHUNT_API_KEY: ${{ secrets.PRODUCTHUNT_API_KEY }}

      - name: Upload prospect CSV as artifact
        uses: actions/upload-artifact@v4
        with:
          name: prospects-${{ github.run_id }}
          path: prospects_*.csv
          retention-days: 90

  # ── Job 2: Market Intel Digest (runs after sourcing completes) ───────────
  market-digest:
    name: Market Intel Digest
    runs-on: ubuntu-latest
    needs: prospect-sourcing   # waits for Job 1 to finish

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run market digest
        run: python run_digest.py
        env:
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          NOTION_TOKEN:       ${{ secrets.NOTION_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Upload digest as artifact
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ github.run_id }}
          path: digest_*.md
          retention-days: 90
